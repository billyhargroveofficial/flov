name: release

# Tag-driven release build. Every platform is produced by the same scripts a
# maintainer runs locally (scripts/build-bundle*.{sh,ps1}), so CI cannot drift
# away from the documented manual path.
#
# CUDA is deliberately absent: the sidecar needs the CUDA toolkit at build time
# and an NVIDIA driver at run time, so the published artifacts ship the CPU
# fallback plus the platform GPU backend (Metal on macOS, Vulkan on Windows).
# A CUDA build stays a local `scripts/build-bundle.ps1` / `--backend cuda` job.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub release instead of only uploading artifacts"
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version-check:
    # AGENTS.md: a tag may not be published unless it matches the version in
    # src-tauri/Cargo.toml and tauri.conf.json.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the crate and Tauri versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)"
          tauri="$(grep -m1 '"version"' src-tauri/tauri.conf.json | cut -d'"' -f4)"
          echo "tag=$tag crate=$crate tauri=$tauri"
          test "$tag" = "$crate" || { echo "::error::tag $tag != src-tauri/Cargo.toml $crate"; exit 1; }
          test "$tag" = "$tauri" || { echo "::error::tag $tag != tauri.conf.json $tauri"; exit 1; }

  linux:
    needs: version-check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libxdo-dev patchelf file
      - run: npm ci --prefix ui
      - name: Build AppImage (CPU sidecar)
        run: ./scripts/build-bundle-linux.sh --backend cpu
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  macos:
    needs: version-check
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install cmake for whisper.cpp
        run: brew install cmake
      - run: npm ci --prefix ui
      - name: Build .app and .dmg (CPU + Metal sidecars)
        # The script pins MACOSX_DEPLOYMENT_TARGET and the clang_rt link flags
        # itself — see the dyld MTLResidencySetDescriptor note in AGENTS.md.
        run: ./scripts/build-bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  windows:
    needs: version-check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install the Vulkan SDK
        # whisper-rs's vulkan feature needs the LunarG SDK headers; the
        # installer sets VULKAN_SDK machine-wide but not in this shell.
        run: |
          choco install vulkan-sdk --no-progress -y
          $sdk = Get-ChildItem 'C:\VulkanSDK' | Sort-Object Name -Descending | Select-Object -First 1
          "VULKAN_SDK=$($sdk.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - run: npm ci --prefix ui
      - name: Build NSIS installer (CPU + Vulkan sidecars)
        run: .\scripts\build-bundle.ps1 -NoCuda
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  publish:
    needs: [linux, macos, windows]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            artifacts/*/*
